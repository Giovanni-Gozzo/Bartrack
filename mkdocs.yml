site_name: "Bartrack - Documentation"
site_url: https://github.com/Giovanni-Gozzo/Bartrack
repo_url: https://github.com/Giovanni-Gozzo/Bartrack
repo_name: Giovanni-Gozzo/Bartrack

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          setup_python_path: [.]
          options:
            show_source: true
            show_root_heading: true

nav:
  - Accueil: index.md
  - Référence API: api.md
